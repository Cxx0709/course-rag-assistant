[project]
name = "course-rag-assistant"
version = "0.1.0"
description = "Course-focused RAG assistant with page-exact citations, prerequisite linking and error-gap analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Cxx0709" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pymupdf>=1.24",
    "python-pptx>=1.0",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
course-rag = "course_rag_assistant.cli:main"
course-rag-web = "course_rag_assistant.web:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
course_rag_assistant = ["web_assets/*.html", "web_assets/*.css", "web_assets/*.js", "web_assets/sample/*.md"]
